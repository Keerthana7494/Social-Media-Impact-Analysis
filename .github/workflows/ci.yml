
name: Social Media Imapact Analysis On Student Life

# When should this workflow execute?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permissions required by this workflow
permissions:
  contents: read

# Jobs to execute
jobs:

  test:

    # GitHub provides an Ubuntu machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # Step 3: Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Step 5: Execute automated tests
      - name: Run tests
        run: python -m pytest -v
